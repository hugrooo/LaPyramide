name: la_pyramide
description: Le jeu de cartes alcoolisé La Pyramide — version mobile iOS & Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_database: ^11.0.0

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.2
  lottie: ^3.1.2

  # Audio
  audioplayers: ^6.1.0

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  cached_network_image: ^3.4.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  confetti: ^0.8.0
  in_app_purchase: ^3.2.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/

  # fonts:
  #   - family: FredokaOne
  #     fonts:
  #       - asset: assets/fonts/FredokaOne-Regular.ttf
